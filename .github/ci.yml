name: CI Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check required files exist
        run: |
          test -f index.html || exit 1
          test -f style.css || exit 1
          test -f script.js || exit 1
          echo "All required core files are present."